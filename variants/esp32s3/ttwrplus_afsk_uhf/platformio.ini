[env:ttwrplus_afsk_uhf]
; LilyGo T-TWR Plus REV 2.1 — ESP32-S3, SA868 UHF (400-480 MHz), AFSK1200/AX.25 transport
custom_meshtastic_hw_model = 9000
custom_meshtastic_hw_model_slug = TTWRPLUS_AFSK_UHF
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LilyGo T-TWR Plus REV2.1 (UHF AFSK)
custom_meshtastic_tags = LilyGo,HamRadio,AFSK

extends = esp32s3_base
board = ttwrplus_afsk_uhf
board_build.variant = esp32s3
board_check = false
upload_protocol = esptool
monitor_speed = 115200

build_unflags =
  ${esp32s3_base.build_unflags}
  -DLED_BUILTIN

lib_deps =
  ${esp32s3_base.lib_deps}
  WiFi

build_flags =
  ${esp32s3_base.build_flags}
  -D TTWRPLUS_AFSK_UHF=1
  -D USE_SA868_AFSK=1
  -D MESHTASTIC_EXCLUDE_LORA=1
  -I variants/esp32s3/ttwrplus_afsk_uhf
  -D ENCODER_A_PIN=47
  -D ENCODER_B_PIN=46
  -D ENCODER_BIT_P=21
  -D USER_BUTTON=21

board_build.partitions = variants/esp32s3/ttwrplus_afsk_uhf/large_spiffs_16MB_aligned.csv
