name: Publish downloads page
on:
  push:
    branches: [distribution]
    paths: [index.html, .github/workflows/page.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare page and public release listing
        run: |
          mkdir site
          cp index.html site/index.html
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > site/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
