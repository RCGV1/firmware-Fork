name: Sync upstream firmware
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: upstream-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -v
      - run: python3 tools/distribute.py scan
        env:
          GH_TOKEN: ${{ github.token }}
